[project]
name = "dl-loop-fixed"
version = "0.1.0"
description = "dual-lobe loop variant: dl-loop-fixed"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[litellm]>=1.15.11,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dl_loop_fixed"]

[tool.crewai]
type = "flow"
definition = "src/dl_loop_fixed/flow.json"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]
